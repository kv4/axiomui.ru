name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build
      - name: Deploy site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: /home/admin/site
          strip_components: 0
          rm: true
      - name: Deploy cases subpages
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            rm -rf /tmp/axm-portfolio
            git clone --depth 1 https://github.com/kv4/axiomui.ru.git /tmp/axm-portfolio
            mkdir -p /home/admin/site/portfolio
            cp /tmp/axm-portfolio/public/portfolio/*.html /home/admin/site/portfolio/
            rm -rf /tmp/axm-portfolio
            ls -la /home/admin/site/portfolio/
            D=/home/admin/site/axmdiag-7k2q9x.css
            echo "== nginx -T (locations/roots/proxy) ==" > $D
            sudo nginx -T 2>/dev/null | grep -nE "server_name|listen |root |location|proxy_pass|try_files|include /etc" >> $D || true
            echo "== site dir ==" >> $D
            ls -la /home/admin/site/ >> $D 2>&1 || true
            echo "== pm2 ==" >> $D
            pm2 list >> $D 2>&1 || true
            echo "== bots server env port ==" >> $D
            grep -rn "listen\|PORT" /home/admin/bots/telegram/index.js >> $D 2>/dev/null | head -5 || true
            echo "== direct node test ==" >> $D
            for p in 3000 3001 8080; do echo "port $p /cases/index.html: $(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 http://127.0.0.1:$p/cases/index.html)" >> $D; echo "port $p /axmdiag: $(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 3 http://127.0.0.1:$p/axmdiag-7k2q9x.css)" >> $D; done
      - name: Deploy bots
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bots/"
          target: /home/admin
          strip_components: 1
      - name: Reload site and bots
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/admin/bots
            npm install --omit=dev
            pm2 startOrReload pm2.config.js --update-env
            pm2 save
            sudo nginx -t && sudo systemctl reload nginx
