name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build
      - name: Deploy site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: /home/admin/site
          strip_components: 0
          rm: true
      - name: Ensure /cases redirect to /portfolio
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            sudo cp -n /etc/nginx/sites-enabled/axiomui /home/admin/axiomui.nginx.bak 2>/dev/null || true
            sudo sed -i 's|alias /home/admin/site/public/cases/;|rewrite ^/cases/(.*)$ /portfolio/$1 permanent;|' /etc/nginx/sites-enabled/axiomui || true
            sudo nginx -t && sudo systemctl reload nginx
            rm -rf /home/admin/site/cases /home/admin/site/portfolio /home/admin/site/axmdiag-7k2q9x.css /home/admin/site/axmdiag-7k2q9x.txt /home/admin/site/dist/axmdiag-7k2q9x.css
            ls -la /home/admin/site/dist/ | head -12
      - name: Deploy bots
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bots/"
          target: /home/admin/bots
          strip_components: 1
      - name: Reload site and bots
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/admin/bots
            npm install --omit=dev
            pm2 delete telegram-bot || true
            rm -rf /home/admin/bots/telegram
            pm2 startOrReload pm2.config.js --update-env
            pm2 save
            sudo nginx -t && sudo systemctl reload nginx
