name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run build
      - name: Deploy site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: /home/admin/site
          strip_components: 0
          rm: true
      - name: Deploy cases subpages
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            rm -rf /tmp/axm-portfolio
            git clone --depth 1 https://github.com/kv4/axiomui.ru.git /tmp/axm-portfolio
            mkdir -p /home/admin/site/portfolio
            cp /tmp/axm-portfolio/public/portfolio/*.html /home/admin/site/portfolio/
            rm -rf /tmp/axm-portfolio
            ls -la /home/admin/site/portfolio/
            sudo nginx -T 2>/dev/null | grep -n -B6 -A12 "case" > /home/admin/site/axmdiag-7k2q9x.txt || echo "no case rules found" > /home/admin/site/axmdiag-7k2q9x.txt
            sudo nginx -T 2>/dev/null | grep -n "listen\|server_name\|root\|include /etc" >> /home/admin/site/axmdiag-7k2q9x.txt || true
      - name: Deploy bots
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bots/"
          target: /home/admin
          strip_components: 1
      - name: Reload site and bots
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 46.17.42.111
          username: admin
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/admin/bots
            npm install --omit=dev
            pm2 startOrReload pm2.config.js --update-env
            pm2 save
            sudo nginx -t && sudo systemctl reload nginx
